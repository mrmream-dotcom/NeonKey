# Builds the demo site for GitHub Pages at https://neonkey.tech/ (custom domain; public/CNAME is copied into dist).
# Requires: repo Settings > Pages > Build and deployment > Source = "GitHub Actions".
# Until that is switched on, the deploy job will fail harmlessly; the build job still checks the site compiles.
name: Deploy demo to GitHub Pages

on:
  # Manual only for now: the demo is served from the gh-pages branch.
  # Re-enable push after switching Pages Source to "GitHub Actions".
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://neonkey.tech
      BASE_PATH: /
      PUBLIC_SITE_MODE: live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
