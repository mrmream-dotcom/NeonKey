# Builds the demo site for GitHub Pages at https://neonkey.tech/ (custom domain; public/CNAME is copied into dist).
# Requires: repo Settings > Pages > Build and deployment > Source = "GitHub Actions".
# Until that is switched on, the deploy job will fail harmlessly; the build job still checks the site compiles.
name: Deploy demo to GitHub Pages

on:
  # Manual only for now: the demo is served from the gh-pages branch.
  # Re-enable push after switching Pages Source to "GitHub Actions".
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://neonkey.tech
      BASE_PATH: /
      PUBLIC_SITE_MODE: live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
