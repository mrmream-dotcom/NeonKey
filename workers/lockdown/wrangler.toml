# NeonKey Email Lockdown Worker: Stripe payment -> DNS audit -> branded report to the buyer, rechecks, notices to hello@.
# Shares nothing with the other workers (its own Stripe webhook endpoint, its own secret, its own KV).
# Secrets (set with `wrangler secret put`, never committed, never pasted in chat):
#   STRIPE_WEBHOOK_SECRET  whsec_... from THIS endpoint in Stripe (not the payments Worker's)
#   RESEND_API_KEY
#   BROWSER_TOKEN          optional: Cloudflare API token with Account > Browser Rendering > Edit. Turns the report into a PDF;
#                          without it the report is attached as an HTML file instead.
#   GOOGLE_SA_KEY          optional: Google service account JSON key. Writes each paid order (and refunds) to the
#                          Lead Tracker tab. Share ONLY that sheet with the service account's email as Editor.
name = "neonkey-lockdown"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = true
preview_urls = false

[vars]
FROM_ADDRESS = "NeonKey 🔑 <hello@neonkey.tech>"
NOTIFY_TO = "hello@neonkey.tech"
REPLY_TO = "hello@neonkey.tech"
# Every email this Worker sends is BCC'd here (Resend has no account-level BCC).
BCC_ADDRESS = "mr.mream@gmail.com"
# Only checkouts from these Payment Links are handled (comma-separated). First: the live $29 Email Lockdown link
# (buy.stripe.com/9B6dR8bFk14cfZR94Eb3q08, since Nov 11 2026). Second: the retired $49 link
# (buy.stripe.com/8x2aEWaBgcMU9Bt5Ssb3q01), kept so a checkout already open on it still gets its report.
LOCKDOWN_PAYMENT_LINK = "plink_1UajXgCRxS1tvAi2TjNiqT0y,plink_1UXuPCCRxS1tvAi22FJy7HTk"
ALLOW_LIVE = "true"
# "shadow": buyer emails go to hello@ only (Michael reads them first). "send": they go to the buyer.
CUSTOMER_EMAILS = "send"
# Cloudflare account that renders the PDF report (Browser Rendering). Not a secret.
CF_ACCOUNT_ID = "13d2e240576e100fbd65b2499bd6c048"
# Lead Tracker sync target: Google Sheet "NeonKey Accounts", tab "Lead Tracker". Not secrets.
LEAD_SHEET_ID = "1C1TR4aB0QyEiSR84fBFHbRxUeplDcJSnw-LJnBfR9yg"
LEAD_SHEET_TAB = "Lead Tracker"

# Orders (Stripe session id, buyer email and name, domain, recheck count). Expire after 180 days (covers the card-dispute window).
# KV namespace "neonkey-lockdown-orders" (created Nov 5 2026).
[[kv_namespaces]]
binding = "ORDERS"
id = "7629cb98c9ed42598f842af4426f491f"

# Daily rechecks at 17:07 UTC (8:07 AM AKST).
[triggers]
crons = ["7 17 * * *"]

# Workers Logs: keeps this Worker's console.log lines (errors, failed sends) for 3 days in the Cloudflare dashboard.
# Invocation logs are off so request URLs (which can carry a private dashboard link) are never stored.
[observability]
enabled = true

[observability.logs]
invocation_logs = false
