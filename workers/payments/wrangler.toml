# NeonKey payments Worker: Stripe webhook -> notice email to hello@neonkey.tech (BCC Michael).
# LIVE since Nov 4 2026 (Michael chose "Live now, with guardrails" and said "merge and deploy").
# Secrets (set with `wrangler secret put`, never committed, never pasted in chat):
#   STRIPE_WEBHOOK_SECRET  whsec_... from the webhook endpoint in the Stripe Dashboard
#   RESEND_API_KEY
name = "neonkey-payments"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = true
preview_urls = false

[vars]
FROM_ADDRESS = "NeonKey 🔑 <hello@neonkey.tech>"
NOTIFY_TO = "hello@neonkey.tech"
# Every email this Worker sends is BCC'd here (Resend has no account-level BCC).
BCC_ADDRESS = "mr.mream@gmail.com"
# Live-mode events are ignored unless this is "true". Michael approved live on Nov 4 2026.
ALLOW_LIVE = "true"
# Founder Stack Payment Link. Paid checkouts from it (or with metadata offer=nk_founder_stack_guide) get the PDF emailed.
FOUNDER_STACK_LINK = "plink_1UYvrICRxS1tvAi2komKzvTp"

# Private product files (the Founder Stack PDF). Never in the repo or on the site; no route serves it.
[[kv_namespaces]]
binding = "PRODUCTS"
id = "d078b508b3954a908d17fe7bc72c8a65"

# Workers Logs: keeps this Worker's console.log lines (errors, failed sends) for 3 days in the Cloudflare dashboard.
# Invocation logs are off so request URLs (which can carry a private dashboard link) are never stored.
[observability]
enabled = true

[observability.logs]
invocation_logs = false
